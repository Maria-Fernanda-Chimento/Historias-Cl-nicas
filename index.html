<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Historia Clínica Psiquiátrica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f1117;color:#e2e8f8;font-family:'Segoe UI',sans-serif;font-size:14px;}
.hdr{background:#181c27;border-bottom:1px solid #2a3050;padding:0 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:56px;}
.hdr-title{font-weight:700;font-size:15px;}
.hdr-sub{font-size:11px;color:#6b7a99;}
.tabs{background:#181c27;border-bottom:1px solid #2a3050;display:flex;overflow-x:auto;}
.tab{padding:12px 14px;background:transparent;border:none;border-bottom:2px solid transparent;color:#9aa5c4;font-size:12px;cursor:pointer;white-space:nowrap;}
.tab.active{border-bottom-color:#4f8ef7;color:#4f8ef7;font-weight:700;}
.content{max-width:900px;margin:0 auto;padding:20px 16px;}
.card{background:#1e2335;border:1px solid #2a3050;border-radius:12px;padding:20px;margin-bottom:16px;}
.sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid #2a3050;font-size:15px;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:#6b7a99;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
input,textarea,select{background:#181c27;border:1px solid #2a3050;border-radius:8px;color:#e2e8f8;padding:9px 12px;font-size:13px;width:100%;font-family:inherit;outline:none;}
input:focus,textarea:focus,select:focus{border-color:#4f8ef7;}
textarea{resize:vertical;line-height:1.6;}
.btn{border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #4f8ef7;background:#4f8ef7;color:#fff;}
.btn.outline{background:transparent;color:#4f8ef7;}
.btn.sm{padding:5px 12px;font-size:12px;}
.btn.red{border-color:#f87171;background:#f87171;}
.btn.red.outline{background:transparent;color:#f87171;}
.btn.amber{border-color:#fbbf24;}
.btn.amber.outline{background:transparent;color:#fbbf24;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:5px 12px;border-radius:20px;border:1px solid #2a3050;background:transparent;color:#9aa5c4;font-size:12px;cursor:pointer;}
.chip.on{border-color:#4f8ef7;background:#1a2d5a;color:#4f8ef7;}
.med-card{border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #2a3050;background:#181c27;}
.med-card.active{background:#0d3327;border-color:#34d39944;}
.table{width:100%;border-collapse:collapse;font-size:13px;}
.table th{text-align:left;padding:6px 8px;border-bottom:1px solid #2a3050;font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7a99;}
.table td{padding:7px 8px;}
.score-bar{margin-top:8px;}
.score-bar .nums{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px;font-weight:700;}
.bar-bg{height:8px;background:#2a3050;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.alert{padding:14px;border-radius:10px;font-size:13px;line-height:1.7;margin-bottom:16px;}
.alert.amber{background:#3a2a00;color:#fbbf24;}
.alert.green{background:#0d3327;color:#34d399;}
.alert.blue{background:#1a2d5a;color:#4f8ef7;}
.check-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;border:1px solid #2a3050;margin-bottom:10px;cursor:pointer;}
.check-row.on{background:#0d3327;border-color:#34d39944;}
.check-box{width:22px;height:22px;border-radius:6px;border:2px solid #2a3050;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
.check-box.on{background:#34d399;border-color:#34d399;}
.sig-line{height:70px;border-bottom:2px solid #2a3050;margin-bottom:8px;}
.subtabs{display:flex;gap:8px;margin-bottom:14px;}
.subtab{padding:7px 16px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid #2a3050;background:#181c27;color:#9aa5c4;}
.subtab.active{border-color:#a78bfa;background:#2d1f5a;color:#a78bfa;font-weight:700;}
.consul-btn{padding:7px 14px;border-radius:8px;border:1px solid #2a3050;background:#181c27;color:#9aa5c4;font-size:12px;cursor:pointer;}
.consul-btn.active{border-color:#4f8ef7;background:#1a2d5a;color:#4f8ef7;font-weight:700;}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.sum-box{background:#181c27;border-radius:10px;padding:14px;text-align:center;}
.sum-box .lbl{font-size:11px;color:#6b7a99;margin-bottom:4px;}
.sum-box .val{font-size:24px;font-weight:800;}
.sum-box .max{font-size:10px;color:#6b7a99;}
@media print{button{display:none!important;}body{background:white!important;color:black!important;}*{color:black!important;background:white!important;border-color:#aaa!important;}}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="hdr-title">🧠 HC Psiquiátrica</div>
    <div class="hdr-sub" id="hdr-pac">Nuevo paciente</div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn outline sm" onclick="window.print()">📄 PDF</button>
    <button class="btn sm" onclick="nuevaConsulta()">+ Consulta</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('datos',this)">👤 Paciente</button>
  <button class="tab" onclick="showTab('medico',this)">🩺 Profesional</button>
  <button class="tab" onclick="showTab('antecedentes',this)">📋 Antecedentes</button>
  <button class="tab" onclick="showTab('anamnesis',this)">🧩 Anamnesis</button>
  <button class="tab" onclick="showTab('fisico',this)">📊 Físico</button>
  <button class="tab" onclick="showTab('consultas',this)">📝 Consultas <span id="cons-badge" style="background:#4f8ef7;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;">1</span></button>
  <button class="tab" onclick="showTab('consentimiento',this)">✍️ Consentimiento</button>
</div>

<div class="content">

<!-- DATOS -->
<div id="tab-datos">
<div class="card">
  <div class="sec-hdr">👤 Identificación del Paciente</div>
  <div class="grid2">
    <div class="field"><label>Apellido</label><input id="apellido" oninput="updHdr()"></div>
    <div class="field"><label>Nombre/s</label><input id="nombre" oninput="updHdr()"></div>
    <div class="field"><label>DNI</label><input id="dni"></div>
    <div class="field"><label>Fecha de Nacimiento</label><input type="date" id="fechaNac"></div>
    <div class="field"><label>Edad</label><input id="edad"></div>
    <div class="field"><label>Sexo biológico</label><select id="sexo"><option>-</option><option>Masculino</option><option>Femenino</option><option>Intersexual</option></select></div>
    <div class="field"><label>Estado civil</label><select id="ecivil"><option>-</option><option>Soltero/a</option><option>Casado/a</option><option>Unión convivencial</option><option>Divorciado/a</option><option>Viudo/a</option></select></div>
    <div class="field"><label>Instrucción</label><select id="instruccion"><option>-</option><option>Sin instrucción</option><option>Primario</option><option>Secundario</option><option>Universitario</option><option>Posgrado</option></select></div>
    <div class="field"><label>Ocupación</label><input id="ocupacion"></div>
    <div class="field"><label>Obra social</label><input id="obrasocial"></div>
    <div class="field"><label>Teléfono</label><input id="telefono"></div>
    <div class="field"><label>Email</label><input id="email"></div>
  </div>
  <div class="field"><label>Domicilio</label><input id="domicilio"></div>
  <div class="grid2">
    <div class="field"><label>Contacto emergencia</label><input id="contacto"></div>
    <div class="field"><label>Tel. emergencia</label><input id="tel-emergencia"></div>
  </div>
</div>
</div>

<!-- MEDICO -->
<div id="tab-medico" style="display:none">
<div class="card">
  <div class="sec-hdr">🩺 Datos del Profesional</div>
  <div class="grid2">
    <div class="field"><label>Nombre</label><input id="med-nombre" placeholder="Dr./Dra."></div>
    <div class="field"><label>Matrícula (MN/MP)</label><input id="med-matricula"></div>
    <div class="field"><label>Especialidad</label><input id="med-esp" value="Psiquiatría"></div>
    <div class="field"><label>Consultorio</label><input id="med-cons"></div>
    <div class="field"><label>Fecha apertura HC</label><input type="date" id="med-fecha"></div>
  </div>
  <div class="alert amber">⚖️ Sujeta a <strong>Ley 26.529</strong> y <strong>Ley 17.132</strong>. Conservar mínimo 10 años desde la última consulta.</div>
</div>
</div>

<!-- ANTECEDENTES -->
<div id="tab-antecedentes" style="display:none">
<div class="card">
  <div class="sec-hdr">💬 Motivo de Consulta</div>
  <div class="field"><label>Motivo (palabras del paciente)</label><textarea id="motivo" rows="3"></textarea></div>
  <div class="field"><label>Historia de la enfermedad actual</label><textarea id="hea" rows="5"></textarea></div>
</div>
<div class="card">
  <div class="sec-hdr">🧠 Antecedentes Psiquiátricos</div>
  <div class="field"><label>Diagnósticos y tratamientos previos</label><textarea id="ant-psiq" rows="3"></textarea></div>
  <div class="field"><label>Internaciones psiquiátricas</label><textarea id="ant-intern" rows="2"></textarea></div>
  <div class="field"><label>Medicación previa</label><textarea id="ant-med" rows="2"></textarea></div>
</div>
<div class="card">
  <div class="sec-hdr">🏥 Antecedentes Médicos</div>
  <div class="grid2">
    <div class="field"><label>Médicos</label><textarea id="ant-medicos" rows="3"></textarea></div>
    <div class="field"><label>Quirúrgicos</label><textarea id="ant-quir" rows="3"></textarea></div>
  </div>
  <div class="field"><label>Alergias</label><input id="alergias" placeholder="NINGUNA CONOCIDA"></div>
</div>
<div class="card">
  <div class="sec-hdr">👨‍👩‍👧 Familiares y Hábitos</div>
  <div class="field"><label>Psicopatología familiar</label>
    <div class="chips" id="chips-familia"></div>
  </div>
  <div class="field"><label>Detalle</label><textarea id="ant-fam-det" rows="2"></textarea></div>
  <div class="field"><label>Hábitos y sustancias</label>
    <div class="chips" id="chips-habitos"></div>
  </div>
  <div class="field"><label>Detalle consumo</label><textarea id="sustancias" rows="2"></textarea></div>
</div>
</div>

<!-- ANAMNESIS -->
<div id="tab-anamnesis" style="display:none">
<div class="card">
  <div class="sec-hdr">🧩 Anamnesis Biográfica</div>
  <div class="grid2">
    <div class="field"><label>Desarrollo psicomotor</label><textarea id="a-desarrollo" rows="3"></textarea></div>
    <div class="field"><label>Historia familiar</label><textarea id="a-familia" rows="3"></textarea></div>
    <div class="field"><label>Historia escolar</label><textarea id="a-escolar" rows="3"></textarea></div>
    <div class="field"><label>Historia laboral</label><textarea id="a-laboral" rows="3"></textarea></div>
    <div class="field"><label>Historia relacional</label><textarea id="a-relacional" rows="3"></textarea></div>
    <div class="field"><label>Historia traumática</label><textarea id="a-trauma" rows="3"></textarea></div>
  </div>
  <div class=
